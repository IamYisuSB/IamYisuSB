name: Actualizar tarjetas del README

on:
  schedule:
    - cron: "17 4 * * *" # una vez al dia
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Tarjeta de estadisticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=radical&show_icons=true&hide_border=true&locale=es
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tarjeta de lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=radical&layout=compact&hide_border=true&langs_count=6&locale=es
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Proyecto pixelote
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=pixelote&theme=radical&hide_border=true
          path: profile/pin-pixelote.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Proyecto climeo
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=climeo&theme=radical&hide_border=true
          path: profile/pin-climeo.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Proyecto kipack
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=kipack&theme=radical&hide_border=true
          path: profile/pin-kipack.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Proyecto portfolio-jesus-guerrero
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=portfolio-jesus-guerrero&theme=radical&hide_border=true
          path: profile/pin-portfolio-jesus-guerrero.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Actualizar tarjetas del README" || exit 0
          git push
